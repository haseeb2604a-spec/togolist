<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Todo List Complete</title>
</head>
<body class="min-h-screen bg-slate-950 text-white px-4 py-10">
    <main class="mx-auto w-full max-w-3xl">
        <header class="mb-8 text-center">
            <p class="mb-2 text-sm font-semibold uppercase tracking-[0.25em] text-cyan-300"></p>
            <h1 class="text-4xl font-extrabold sm:text-5xl">Todo List</h1>
            <p class="mt-3 text-slate-300"></p>
        </header>

        <section class="rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-2xl sm:p-7">
            <form id="taskForm" class="flex flex-col gap-3 sm:flex-row">
                <input
                    type="text"
                    id="input"
                    placeholder="Enter a task..."
                    maxlength="180"
                    autocomplete="off"
                    class="min-w-0 flex-1 rounded-xl border border-slate-600 bg-slate-800 px-4 py-3 text-white outline-none transition placeholder:text-slate-400 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20"
                >
                <button type="submit" class="rounded-xl bg-cyan-400 px-6 py-3 font-bold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-200">
                    + Add Task
                </button>
            </form>

            <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-[1fr_auto]">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                    class="min-w-0 rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white outline-none placeholder:text-slate-400 focus:border-cyan-400"
                >
                <select id="filterSelect" aria-label="Filter tasks" class="rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-white outline-none focus:border-cyan-400">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending Tasks</option>
                    <option value="completed">Completed Tasks</option>
                </select>
            </div>

            <div class="mt-5 grid grid-cols-3 gap-3 text-center">
                <div class="rounded-xl bg-slate-800 p-3">
                    <p id="totalCount" class="text-2xl font-extrabold text-cyan-300">0</p>
                    <p class="mt-1 text-xs text-slate-300 sm:text-sm">Total</p>
                </div>
                <div class="rounded-xl bg-slate-800 p-3">
                    <p id="pendingCount" class="text-2xl font-extrabold text-amber-300">0</p>
                    <p class="mt-1 text-xs text-slate-300 sm:text-sm">Pending</p>
                </div>
                <div class="rounded-xl bg-slate-800 p-3">
                    <p id="completedCount" class="text-2xl font-extrabold text-emerald-300">0</p>
                    <p class="mt-1 text-xs text-slate-300 sm:text-sm">Completed</p>
                </div>
            </div>

            <div class="mt-6">
                <div class="mb-2 flex items-center justify-between gap-3 text-sm">
                    <span class="font-semibold text-slate-200">Completion progress</span>
                    <span id="progressText" class="text-cyan-300">0%</span>
                </div>
                <div class="h-2.5 overflow-hidden rounded-full bg-slate-700">
                    <div id="progressBar" class="h-full w-0 rounded-full bg-gradient-to-r from-cyan-400 to-emerald-400 transition-all duration-300"></div>
                </div>
            </div>

            <div class="mt-7">
                <div class="mb-3 flex items-center justify-between gap-3">
                    <h2 class="text-xl font-bold">My Tasks</h2>
                    <button id="clearCompleted" type="button" class="text-sm font-semibold text-rose-300 transition hover:text-rose-200">
                        Clear completed
                    </button>
                </div>
                <div id="dynamiclist" class="space-y-3"></div>
                <p id="emptyMessage" class="rounded-xl border border-dashed border-slate-700 px-4 py-10 text-center text-slate-400">
                    No tasks yet. Add your first task above!
                </p>
            </div>
        </section>
        <p class="mt-5 text-center text-xs text-slate-500"></p>
    </main>

    <script src="todolist.js"></script>
</body>
</html>
